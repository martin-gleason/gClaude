name: Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/

      - name: Test with coverage
        run: pytest --cov=src --cov-fail-under=90 -v

  deploy-prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: gclaude
      max_instances: 3
      daily_budget_usd: "5.00"
      log_level: INFO
      gcs_bucket_name: gclaude-prod-files
      google_chat_project_number: ${{ vars.GOOGLE_CHAT_PROJECT_NUMBER_PROD }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      AUTHORIZED_USERS: ${{ secrets.AUTHORIZED_USERS_PROD }}

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: gclaude-dev
      max_instances: 1
      daily_budget_usd: "1.00"
      log_level: DEBUG
      gcs_bucket_name: gclaude-dev-files
      google_chat_project_number: ${{ vars.GOOGLE_CHAT_PROJECT_NUMBER_DEV }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      AUTHORIZED_USERS: ${{ secrets.AUTHORIZED_USERS_DEV }}
