name: Deploy Cloud Run Service

on:
  workflow_call:
    inputs:
      service_name:
        description: Cloud Run service name
        required: true
        type: string
      max_instances:
        description: Maximum Cloud Run instances
        required: true
        type: number
      daily_budget_usd:
        description: Daily API budget in USD
        required: true
        type: string
      log_level:
        description: Application log level
        required: true
        type: string
      gcs_bucket_name:
        description: GCS bucket for file storage
        required: true
        type: string
      google_chat_project_number:
        description: Google Chat bot project number
        required: true
        type: string
    secrets:
      GCP_PROJECT_ID:
        required: true
      WIF_PROVIDER:
        required: true
      WIF_SERVICE_ACCOUNT:
        required: true
      AUTHORIZED_USERS:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push
        run: |
          IMAGE=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gclaude/gclaude:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gclaude/gclaude:${{ github.sha }}
          gcloud run deploy ${{ inputs.service_name }} \
            --image $IMAGE \
            --region us-central1 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances ${{ inputs.max_instances }} \
            --timeout 60 \
            --set-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest \
            --set-env-vars VERIFY_TOKEN=true \
            --set-env-vars AUTHORIZED_USERS=${{ secrets.AUTHORIZED_USERS }} \
            --set-env-vars DAILY_BUDGET_USD=${{ inputs.daily_budget_usd }} \
            --set-env-vars LOG_LEVEL=${{ inputs.log_level }} \
            --set-env-vars GCS_BUCKET_NAME=${{ inputs.gcs_bucket_name }} \
            --set-env-vars GOOGLE_CHAT_PROJECT_NUMBER=${{ inputs.google_chat_project_number }} \
            --allow-unauthenticated
